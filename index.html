<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DormMate" />
    <meta name="application-name" content="DormMate" />
    <meta name="description" content="Manage shared life in your dorm or apartment: Track fridge inventory, aircond usage, and split bills easily." />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="msapplication-TileColor" content="#f6f7fb" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />
    
    <title>DormMate - Roommate Expense & Shared Life Tracker</title>
    
    <!-- Icons (versioned to force refresh) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-v2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-v2.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      :root {
        color-scheme: light;
        font: 100%/1.5 system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      body {
        margin: 0;
        font-family: inherit;
        color: #1d1d1f;
        background: #f6f7fb;
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
      }

      html[data-theme="dark"] body {
        color: #e7f0ff;
        background: #0b1220;
      }

      html[data-theme="dark"] .theme-app,
      html[data-theme="dark"] .theme-login {
        color: #e7f0ff;
        background: #0b1220 !important;
      }

      html[data-theme="dark"] .theme-app .bg-white,
      html[data-theme="dark"] .theme-login .bg-white,
      html[data-theme="dark"] .theme-app .bg-white\/75,
      html[data-theme="dark"] .theme-app .bg-white\/80,
      html[data-theme="dark"] .theme-app .bg-white\/90 {
        background-color: #111c2f !important;
        color: #e7f0ff;
      }

      html[data-theme="dark"] .theme-app .bg-\[\#f2f2f7\],
      html[data-theme="dark"] .theme-app .bg-\[\#f6f7fb\],
      html[data-theme="dark"] .theme-app .bg-\[\#e5e5ea\],
      html[data-theme="dark"] .theme-login .bg-\[\#f2f2f7\],
      html[data-theme="dark"] .theme-login .bg-\[\#e5e5ea\] {
        background-color: #162238 !important;
        color: #dbeafe;
      }

      html[data-theme="dark"] .theme-app input,
      html[data-theme="dark"] .theme-app textarea,
      html[data-theme="dark"] .theme-app select,
      html[data-theme="dark"] .theme-login input,
      html[data-theme="dark"] .theme-login textarea,
      html[data-theme="dark"] .theme-login select {
        color: #e7f0ff;
        background-color: #162238;
        border-color: #294568;
      }

      html[data-theme="dark"] .theme-app .text-gray-900,
      html[data-theme="dark"] .theme-app .text-gray-800,
      html[data-theme="dark"] .theme-app .text-gray-700,
      html[data-theme="dark"] .theme-app .text-gray-600,
      html[data-theme="dark"] .theme-app .text-gray-500,
      html[data-theme="dark"] .theme-app .text-gray-400,
      html[data-theme="dark"] .theme-login .text-gray-900,
      html[data-theme="dark"] .theme-login .text-gray-800,
      html[data-theme="dark"] .theme-login .text-gray-700,
      html[data-theme="dark"] .theme-login .text-gray-600,
      html[data-theme="dark"] .theme-login .text-gray-500,
      html[data-theme="dark"] .theme-login .text-gray-400 {
        color: #b8c7dc !important;
      }

      html[data-theme="dark"] .theme-app .text-\[\#1d1d1f\],
      html[data-theme="dark"] .theme-app .text-\[\#6e6e73\],
      html[data-theme="dark"] .theme-app .text-\[\#8e8e93\] {
        color: #dbeafe !important;
      }

      html[data-theme="dark"] .theme-app .border-gray-100,
      html[data-theme="dark"] .theme-app .border-gray-200,
      html[data-theme="dark"] .theme-app .border-gray-300,
      html[data-theme="dark"] .theme-app .border-black\/\[0\.06\],
      html[data-theme="dark"] .theme-app .border-black\/\[0\.05\],
      html[data-theme="dark"] .theme-app .border-black\/\[0\.04\] {
        border-color: #294568 !important;
      }

      html[data-theme="dark"] .theme-app .balance-panel {
        background: #142d4d !important;
        color: #e7f0ff;
      }

      html[data-theme="dark"] .theme-app .overdue-panel {
        background: #142d4d !important;
        color: #e7f0ff;
        border-color: #294568 !important;
      }

      html[data-theme="dark"] .theme-app .overdue-panel .bg-white\/70,
      html[data-theme="dark"] .theme-app .overdue-panel .bg-blue-50 {
        background-color: #19385e !important;
        border-color: #315d91 !important;
        color: #dbeafe !important;
      }

      html[data-theme="dark"] .theme-app .material-surface {
        background-color: rgba(17, 28, 47, .92) !important;
        border-color: #294568 !important;
      }

      html[data-theme="dark"] .theme-login .bg-white\/80 {
        background-color: rgba(17, 28, 47, .92) !important;
        border-color: #294568 !important;
      }

      html[data-theme="dark"] .theme-login button.bg-white {
        background-color: #162238 !important;
      }

      html[data-theme="dark"] .theme-app .hover\:bg-gray-50:hover,
      html[data-theme="dark"] .theme-app .hover\:bg-gray-100:hover,
      html[data-theme="dark"] .theme-app .hover\:bg-\[\#f2f2f7\]:hover,
      html[data-theme="dark"] .theme-login .hover\:bg-\[\#f2f2f7\]:hover {
        background-color: #1b2d48 !important;
      }
      
      /* Safe area padding for notched phones */
      .safe-area-top {
        padding-top: env(safe-area-inset-top);
      }
      .pb-safe {
        padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
      }
      
      /* Motion stays short, interruptible, and non-essential. */
      @keyframes slide-up {
        from {
          transform: translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .animate-slide-up {
        animation: slide-up 260ms cubic-bezier(.22,1,.36,1);
      }
      
      button, input, textarea, select {
        font: inherit;
      }

      button, a {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      button {
        transition: transform 120ms ease, background-color 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
      }

      button:active:not(:disabled) {
        transform: scale(.97);
      }

      button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
        outline: 3px solid rgba(10, 132, 255, .28);
        outline-offset: 2px;
      }
      
      /* Custom scrollbar for lists */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #c7c9d1;
        border-radius: 999px;
      }
      
      /* PWA splash screen styling */
      .pwa-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        z-index: 9999;
      }
      .pwa-splash.hidden { display: none; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: .01ms !important;
        }
        button:active:not(:disabled) { transform: none; }
      }

      @media (prefers-reduced-transparency: reduce) {
        .material-surface { background: rgba(255, 255, 255, .98) !important; backdrop-filter: none !important; }
      }

      @media (prefers-contrast: more) {
        .material-surface { border-color: #6b7280 !important; }
      }
    </style>
  </head>
  <body>
    <!-- PWA Loading Splash -->
    <div id="pwa-splash" class="pwa-splash">
      <svg class="w-24 h-24 text-white animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <h1 class="text-white text-2xl font-bold mt-4">DormMate</h1>
      <p class="text-blue-100 mt-2">Harmonious Shared Living</p>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Hide splash screen when app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('pwa-splash');
          if (splash) splash.classList.add('hidden');
        }, 500);
      });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
