<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DormMate" />
    <meta name="application-name" content="DormMate" />
    <meta name="description" content="Manage shared life in your dorm or apartment: Track fridge inventory, aircond usage, and split bills easily." />
    <meta name="theme-color" content="#2563eb" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />
    
    <title>DormMate - Roommate Expense & Shared Life Tracker</title>
    
    <!-- Icons (versioned to force refresh) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-v2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-v2.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #f3f4f6;
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Safe area padding for notched phones */
      .safe-area-top {
        padding-top: env(safe-area-inset-top);
      }
      .pb-safe {
        padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
      }
      
      /* Modal slide-up animation */
      @keyframes slide-up {
        from {
          transform: translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .animate-slide-up {
        animation: slide-up 0.3s ease-out;
      }
      
      /* Smooth touch interactions */
      button, a {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      
      /* Custom scrollbar for lists */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 2px;
      }
      
      /* PWA splash screen styling */
      .pwa-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        z-index: 9999;
      }
      .pwa-splash.hidden { display: none; }
    </style>
  </head>
  <body>
    <!-- PWA Loading Splash -->
    <div id="pwa-splash" class="pwa-splash">
      <svg class="w-24 h-24 text-white animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <h1 class="text-white text-2xl font-bold mt-4">DormMate</h1>
      <p class="text-blue-100 mt-2">Harmonious Shared Living</p>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Hide splash screen when app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('pwa-splash');
          if (splash) splash.classList.add('hidden');
        }, 500);
      });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
